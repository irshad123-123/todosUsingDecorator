<div class="table-responsive">
    <table class="table table-bordered" *ngIf = 'stdArr.length > 0; else : noStd'>
        <thead>
            <tr>
                <th>Sr No</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Contact</th>
                <th>Active</th>
                <th>Edit</th>
                <th>Remove</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor = 'let std of stdArr; let i=index'>
                <td>{{i+1}}</td>
                <td>{{std.fname}} {{std.lname}}</td>
                <td>{{std.email}}</td>
                <td>{{std.contact}}</td>
                <td>{{std.status === 'active' ? 'YES' : 'NO'}}</td>
                <td>
                    <button
                    (click) = 'onEditStd(std)'
                    mat-raised-button color="primary">Edit</button>
                </td>
                <td>
                    <button
                    (click) = 'onRemoveStd(std.stdId)'
                    mat-raised-button color="warn">Remove</button>
                </td>
            </tr>
        </tbody>
    </table>
    <ng-template #noStd>
        <p class="alert alert-warning">There is no student details !!!</p>
    </ng-template>
</div>
