<div class="card">
    <div class="card-body">
        <form #stdForm="ngForm" (ngSubmit) = 'onSubmitStd()'>
            <div class="form-group">
                <label for="fname">First Name</label>
                <input
                ngModel
                required
                name="fname"
                class="form-control" id="fname">
            </div>
            <div class="form-group">
                <label for="lname">Last Name</label>
                <input
                ngModel
                required
                name="lname"
                class="form-control" id="lname">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input
                ngModel
                required
                name="email"
                class="form-control" id="email">
            </div>
            <div class="form-group">
                <label for="contact">Contact</label>
                <input
                ngModel
                required
                name="contact"
                class="form-control" id="contact">
            </div>
            <div class="form-group">
                <label for="active">Status</label>
                <select ngModel required name="status" id="active" class="form-control">
                    <option value="active">Active</option>
                    <option value="in-active">In Active</option>
                </select>
            </div>
            <div class="d-flex justify-content-end">
                <button
                [disabled] = 'stdForm.invalid'
            *ngIf = '!isEditMode'
            type="submit" mat-raised-button color="primary">Add Student</button>
            <button
            [disabled] = 'stdForm.invalid'
            (click) = 'onUpdateStd()'
            *ngIf = 'isEditMode'
            type="button" mat-raised-button color="primary">Update Student</button>
            <button (click) = 'onCancel()'
            *ngIf = 'isEditMode'
           class="ml-2" type="button" mat-raised-button color="primary">Cancel</button>
            </div>
        </form>
    </div>
</div>
