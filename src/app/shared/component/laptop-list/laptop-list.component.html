<ul class="list-group">
    <li
    *ngFor = 'let laptop of laptopList'
    class="list-group-item d-flex justify-content-between align-items-center">
        <strong>{{laptop.laptopName}}</strong>
        <div>
            <button class="btn-sm mr-2" mat-raised-button color="primary">Edit</button>
            <button class="btn-sm" mat-raised-button color="warn">Remove</button>
        </div>
    </li>
</ul>
